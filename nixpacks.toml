[phases.setup]
# pdo_pgsql is deliberately NOT listed here. Nixpacks' own PHP build
# (php-with-extensions-8.2.27) already bundles it, alongside pgsql, mysqlnd,
# pdo_sqlite, intl, gd and friends - start.sh logs which drivers are live.
#
# Adding phpXXExtensions.pdo_pgsql breaks the build: nix-env merges every
# package into one profile, and two pdo_pgsql derivations both claim
# lib/php/extensions/pdo_pgsql.so, so nix aborts with a collision error.
# If a future PHP bump ever does drop the driver, add exactly ONE version,
# matching the interpreter nixpacks resolves from composer.json's
# `require.php` - a mismatched .so does not error, it just silently fails to
# initialize and resurfaces as "could not find driver" on the first query.
nixPkgs = [
    "...",
    "python311Packages.supervisor",
]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "mkdir -p /run",
    "mkdir -p /var/log",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "cp /assets/php-fpm.conf /etc/php-fpm.conf",
    "chmod +x /assets/start.sh",

    # Build front-end assets. The nixpacks PHP provider normally does this in
    # its own build phase, but declaring cmds here REPLACES that phase, so it
    # has to be spelled out or public/build/manifest.json never exists.
    #
    # Gated on the Node version: the provider pins nodejs_18, while Vite 7 and
    # Tailwind 4 require 20.19+. On Node 18 the build dies on
    # @tailwindcss/oxide's native binding, so it is skipped rather than failing
    # the deploy. Adding nodejs_22 to nixPkgs is NOT the fix - two packages
    # claiming bin/node collide in the nix-env profile, exactly like pdo_pgsql
    # did. To actually ship assets, downgrade to Vite 5 + Tailwind 3 (which run
    # on Node 18) or move this app to a Dockerfile build where the Node version
    # is yours to choose.
    "if [ -f package.json ] && node -e 'process.exit(parseInt(process.versions.node) >= 20 ? 0 : 1)'; then npm ci && npm run build; else echo '>>> Skipping Vite build: Node 18 is too old for Vite 7 / Tailwind 4 (needs 20.19+). public/build/manifest.json will be absent; Blade must guard @vite, as the stock welcome view already does.'; fi",

    # Everything php-fpm (www-data) writes to at runtime.
    "mkdir -p /app/storage/logs",
    "mkdir -p /app/storage/framework/cache",
    "mkdir -p /app/storage/framework/sessions",
    "mkdir -p /app/storage/framework/views",
    "mkdir -p /app/bootstrap/cache",
    "chmod -R 775 /app/storage /app/bootstrap/cache",
    "chown -R www-data:www-data /app/storage /app/bootstrap/cache /var/log",
]

[start]
cmd = '/assets/start.sh'

[healthcheck]
cmd = 'wget --quiet --tries=1 --spider "http://127.0.0.1:${PORT:-80}/nginx-health" || exit 1'
interval = '10s'
timeout = '5s'
retries = 3
startPeriod = '30s'

[staticAssets]
"start.sh" = '''
#!/bin/bash
set -uo pipefail

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# ---------------------------------------------------------------------------
# Filesystem. The image is rebuilt on every deploy, so this is not redundant
# with the build phase - it also covers restarts of an existing container.
# ---------------------------------------------------------------------------
mkdir -p /run /var/log
mkdir -p /app/storage/logs
mkdir -p /app/storage/framework/cache
mkdir -p /app/storage/framework/sessions
mkdir -p /app/storage/framework/views
mkdir -p /app/bootstrap/cache
touch /app/storage/logs/laravel.log
chmod -R 775 /app/storage /app/bootstrap/cache
chmod 664 /app/storage/logs/laravel.log
chown -R www-data:www-data /var/log /app/storage /app/bootstrap/cache

# ---------------------------------------------------------------------------
# PHP extensions.
#
# Nix ships pdo_pgsql as a standalone .so that PHP does not load on its own,
# and the store may hold several builds compiled against different PHP ABIs.
# Loading a mismatched one makes PHP print a startup warning and continue
# without the driver, which surfaces much later as "could not find driver" on
# the first query. So: probe each candidate and keep the first that genuinely
# loads under the interpreter nixpacks actually selected.
# ---------------------------------------------------------------------------
INI_SCAN_DIR=$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;" 2>/dev/null)
if [ -z "$INI_SCAN_DIR" ] || [ ! -d "$INI_SCAN_DIR" ]; then
    PHP_EXT_DIR=$(find /nix/store -maxdepth 1 -type d -name "*php-with-extensions*" | head -n 1)
    if [ -n "$PHP_EXT_DIR" ]; then
        mkdir -p "$PHP_EXT_DIR/lib" 2>/dev/null || true
        INI_SCAN_DIR="$PHP_EXT_DIR/lib"
    fi
fi

echo "PHP $(php -r 'echo PHP_VERSION;' 2>/dev/null) (module API $(php -i 2>/dev/null | grep -i '^PHP Extension =>' | head -1 | awk '{print $NF}'))"

if php -m 2>/dev/null | grep -qi '^pdo_pgsql$'; then
    echo "pdo_pgsql: already built into PHP"
elif [ -n "$INI_SCAN_DIR" ] && [ -d "$INI_SCAN_DIR" ]; then
    PGSQL_LOADED=0
    while read -r CANDIDATE; do
        [ -z "$CANDIDATE" ] && continue
        if php -d "extension=$CANDIDATE" -m 2>/dev/null | grep -qi '^pdo_pgsql$'; then
            echo "extension=$CANDIDATE" > "$INI_SCAN_DIR/pdo_pgsql.ini"
            echo "pdo_pgsql: loaded from $CANDIDATE"
            PGSQL_LOADED=1
            break
        fi
    done < <(find /nix/store -name "pdo_pgsql.so" 2>/dev/null)

    if [ "$PGSQL_LOADED" -eq 0 ]; then
        echo "!!! pdo_pgsql could not be loaded - no .so in /nix/store matches"
        echo "!!! this PHP build's module API. Every query will fail with"
        echo "!!! 'could not find driver', i.e. HTTP 500 on every request."
        echo "!!! Fix: add phpXXExtensions.pdo_pgsql for the PHP version above"
        echo "!!! to nixPkgs in nixpacks.toml."
    fi
else
    echo "!!! No writable PHP ini scan dir found; cannot enable pdo_pgsql."
fi

# ---------------------------------------------------------------------------
# OPcache. Compiled config once here rather than per request.
# ---------------------------------------------------------------------------
if [ -n "$INI_SCAN_DIR" ] && [ -d "$INI_SCAN_DIR" ]; then
    cp /assets/php-performance.ini "$INI_SCAN_DIR/zz-performance.ini"

    # Nix's PHP ships opcache as a zend_extension that may not be enabled by
    # default. Only add the load line when it is genuinely absent, otherwise
    # PHP warns "Cannot load Zend OPcache - it was already loaded".
    if ! php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' 2>/dev/null; then
        OPCACHE_PATH=$(find /nix/store -name "opcache.so" | head -n 1)
        if [ -n "$OPCACHE_PATH" ]; then
            sed -i "1i zend_extension=$OPCACHE_PATH" "$INI_SCAN_DIR/zz-performance.ini"
        fi
    fi
fi

# Disk-backed second level, shared by php-fpm (www-data) and the CLI workers
# so the scheduler's per-minute artisan boots skip recompilation.
mkdir -p /tmp/opcache
chmod 1777 /tmp/opcache

# ---------------------------------------------------------------------------
# APP_KEY. Without it Laravel throws MissingAppKeyException while booting the
# encrypter, which reaches the browser as a bare HTTP 500. Generating one here
# keeps the container serving, but it is regenerated on every restart, which
# silently invalidates all sessions and anything stored via Crypt::. Set
# APP_KEY in Coolify and this branch never runs.
# ---------------------------------------------------------------------------
cd /app

if [ -z "${APP_KEY:-}" ]; then
    export APP_KEY="$(php artisan key:generate --show --no-ansi 2>/dev/null | tr -d '\r\n')"
    echo "==============================================================="
    echo "WARNING: APP_KEY was empty. Temporary key for this run only:"
    echo ""
    echo "    APP_KEY=$APP_KEY"
    echo ""
    echo "Paste it into Coolify's environment variables and redeploy, or"
    echo "users get logged out every time the container restarts."
    echo "==============================================================="
fi

# ---------------------------------------------------------------------------
# Wait for Postgres. Coolify starts the app and the database as separate
# containers with no ordering guarantee, so a cold deploy often races: the
# migration runs before Postgres finishes its own init and fails, and because
# sessions/cache/queue all live in the database, the app then 500s on every
# request until someone redeploys it by hand.
# ---------------------------------------------------------------------------
if [ "${DB_CONNECTION:-pgsql}" = "sqlite" ]; then
    # SQLite path - no separate database service to set up. The file is
    # gitignored and therefore absent from the image, so create it here or
    # every request 500s: sessions, cache and queue all live in the database.
    # It lives inside the container, so it is WIPED on every redeploy unless a
    # Coolify volume is mounted at its directory.
    DB_FILE="${DB_DATABASE:-/app/database/database.sqlite}"
    mkdir -p "$(dirname "$DB_FILE")"
    touch "$DB_FILE"
    chown www-data:www-data "$DB_FILE" "$(dirname "$DB_FILE")"
    chmod 664 "$DB_FILE"
    chmod 775 "$(dirname "$DB_FILE")"
    echo "--- Using SQLite at $DB_FILE ---"
    echo "NOTE: this file is inside the container. Mount a volume at"
    echo "      $(dirname "$DB_FILE") or the data is lost on every deploy."
elif [ "${DB_CONNECTION:-pgsql}" = "pgsql" ]; then
    echo "--- Waiting for Postgres at ${DB_HOST:-?}:${DB_PORT:-5432} ---"
    for i in $(seq 1 30); do
        if php -r '
            $dsn = sprintf("pgsql:host=%s;port=%s;dbname=%s",
                getenv("DB_HOST"), getenv("DB_PORT") ?: "5432", getenv("DB_DATABASE"));
            try { new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD")); exit(0); }
            catch (Throwable $e) { fwrite(STDERR, $e->getMessage() . PHP_EOL); exit(1); }
        ' 2>/dev/null; then
            echo "Postgres is reachable."
            break
        fi
        echo "  attempt $i/30 - not ready yet, retrying in 2s"
        sleep 2
    done
fi

# ---------------------------------------------------------------------------
# Migrations. Deliberately NOT silenced with `|| true`: SESSION_DRIVER,
# CACHE_STORE and QUEUE_CONNECTION are all `database`, so a failed migration
# means a 500 on every request - it has to be visible in the deploy log.
# ---------------------------------------------------------------------------
echo "--- Running migrations ---"
if ! php artisan migrate --force --no-interaction; then
    echo "!!! MIGRATIONS FAILED."
    echo "!!! Sessions, cache and queue all use the database, so the app will"
    echo "!!! return HTTP 500 on every request until this is fixed."
    echo "!!! Check DB_HOST / DB_DATABASE / DB_USERNAME / DB_PASSWORD."
fi

# ---------------------------------------------------------------------------
# Caches, built after APP_KEY and the database are settled so what gets cached
# is correct. Cleared first so a stale cache baked into the image cannot win.
# ---------------------------------------------------------------------------
# Filament keeps its compiled CSS/JS inside the vendor package and copies it
# into public/ on demand. Those copies are gitignored (they would otherwise go
# stale against the installed version on every composer update), so without
# this step /admin renders unstyled with no working JavaScript.
echo "--- Publishing Filament assets ---"
php artisan filament:assets --no-interaction || true

echo "--- Building caches ---"
php artisan optimize:clear --no-interaction || true
php artisan filament:optimize-clear --no-interaction || true
php artisan config:cache --no-interaction || true
php artisan route:cache --no-interaction || true
php artisan view:cache --no-interaction || true
# Caches Filament's discovered panel components and the Blade icon manifest.
# Without it every request re-scans app/Filament and re-resolves icon sets
# from disk, which is the single biggest cost on a cold Filament page.
php artisan filament:optimize --no-interaction || true
php artisan storage:link --no-interaction || true

echo "--- Starting supervisor ---"
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /etc/php-fpm.conf -F
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=500 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"php-fpm.conf" = '''
[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
; Sized for a small VPS: roughly (available RAM - 1G) / 150M.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle children so a leak in one request cannot bloat a worker forever.
pm.max_requests = 500
; Required: start.sh exports APP_KEY into the environment php-fpm inherits.
clear_env = no
; Surface PHP's own startup fatals in the container log. Without this, an
; error before Laravel boots is an unexplained 500 with nothing written
; to storage/logs/laravel.log.
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300

php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[sys_temp_dir] = /tmp
'''

"php-performance.ini" = '''
; OPcache. Sized for a Laravel skeleton plus vendor (~5k files today);
; raise max_accelerated_files if the dependency tree grows a lot.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The container image is immutable, so 60s revalidation is plenty. It is
; deliberately not 0: an operator running `artisan config:cache` inside a
; running container should still see it take effect.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
; Laravel and several packages read docblocks - never set this to 0.
opcache.save_comments=1
; Disk-backed second level, shared with the CLI so the scheduler's
; per-minute artisan boots stop recompiling the framework from source.
opcache.enable_cli=1
opcache.file_cache=/tmp/opcache
opcache.file_cache_fallback=1

; Laravel resolves a lot of paths per request; the stock 4K cache overflows
; and turns those into repeated stat() syscalls.
realpath_cache_size=4096k
realpath_cache_ttl=600
'''

"nginx.template.conf" = '''
user www-data www-data;
# One worker per core - a fixed count oversubscribes a small VPS.
worker_processes auto;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    # Container logs, so `docker logs` / Coolify's log view shows requests.
    access_log /dev/stdout main;
    error_log /dev/stderr;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 110M;
        client_body_timeout 600;
        send_timeout 600;
        proxy_read_timeout 600;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Nginx-served liveness probe - answers 200 as long as the container
        # is up, independent of whether PHP can boot.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 600;
            fastcgi_send_timeout 600;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
